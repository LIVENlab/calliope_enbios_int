        product: natural gas, high pressure
        location: DE
        operator: equals
      - name: petroleum and gas production, offshore
        product: natural gas, high pressure
        location: GB
        operator: equals
      - name: petroleum and gas production, offshore
        product: natural gas, high pressure
        location: NL
        operator: equals
