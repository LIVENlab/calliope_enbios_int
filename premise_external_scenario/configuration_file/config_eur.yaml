# IMPORTANT before starting: in external.py line 799, substitute "possible_locations" for
# new_regions = self.external_scenarios_data[i]["regions"]
# possible_locations = [
#                                region,
#                                *new_regions,
#                                *ecoinvent_regions,
#                                "RoW",
#                                "GLO",
#                                "RER",
#                                "Europe without Switzerland",
