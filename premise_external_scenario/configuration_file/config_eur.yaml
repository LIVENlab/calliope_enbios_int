        location: GB
        operator: equals
      - name: market for natural gas, high pressure
        product: natural gas, high pressure
        location: GR
        operator: equals
      - name: market for natural gas, high pressure
        product: natural gas, high pressure
        location: HU
        operator: equals
      - name: market for natural gas, high pressure
        product: natural gas, high pressure
        location: IE
        operator: equals
      - name: market for natural gas, high pressure
        product: natural gas, high pressure
        location: IT
        operator: equals
      - name: market for natural gas, high pressure
        product: natural gas, high pressure
        location: NL
        operator: equals
      - name: market for natural gas, high pressure
        product: natural gas, high pressure
        location: "NO"
        operator: equals
      - name: market for natural gas, high pressure
        product: natural gas, high pressure
        location: PL
        operator: equals
      - name: market for natural gas, high pressure
        product: natural gas, high pressure
        location: RO
        operator: equals
      - name: market for natural gas, high pressure
        product: natural gas, high pressure
        location: SE
        operator: equals
      - name: market for natural gas, high pressure
        product: natural gas, high pressure
        location: SK
        operator: equals
      - name: market for natural gas, high pressure
        product: natural gas, high pressure
        location: RoE
        operator: equals
      - name: market group for natural gas, high pressure  # TODO: substitutions not working
        product: natural gas, high pressure
        location: Europe without Switzerland
        operator: equals
